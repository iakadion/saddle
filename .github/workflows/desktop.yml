name: desktop artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  desktop:
    name: desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            bundles: deb,rpm,appimage
          - platform: windows
            runner: windows-2025
            bundles: nsis,msi
          - platform: macos
            runner: macos-15
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: resolve release version
        id: releaseversion
        uses: ./.github/actions/releaseversion
        with:
          checkout_tag: "false"

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26.7.0

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf rpm

      - name: install node dependencies
        run: npm ci

      - name: generate platform icons
        shell: bash
        run: npx --yes @tauri-apps/cli@2.11.4 icon desktop/icon.svg --output desktop/src-tauri/icons

      - name: build desktop bundles
        shell: bash
        run: |
          cd desktop
          npx --yes @tauri-apps/cli@2.11.4 build --ci --no-sign --bundles "${{ matrix.bundles }}"

      - name: collect desktop artifacts
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          mkdir -p build/release-assets/desktop
          case "${{ matrix.platform }}" in
            linux)
              deb="$(find desktop/src-tauri/target -type f -path '*/bundle/deb/*.deb' -print -quit)"
              rpm="$(find desktop/src-tauri/target -type f -path '*/bundle/rpm/*.rpm' -print -quit)"
              appimage="$(find desktop/src-tauri/target -type f -path '*/bundle/appimage/*.AppImage' -print -quit)"
              test -n "$deb" && test -n "$rpm" && test -n "$appimage"
              cp "$deb" "build/release-assets/desktop/saddle.browser.${version}.deb"
              cp "$rpm" "build/release-assets/desktop/saddle.browser.${version}.rpm"
              cp "$appimage" "build/release-assets/desktop/saddle.browser.${version}.appimage"
              ;;
            windows)
              exe="$(find desktop/src-tauri/target -type f -path '*/bundle/nsis/*.exe' -print -quit)"
              msi="$(find desktop/src-tauri/target -type f -path '*/bundle/msi/*.msi' -print -quit)"
              test -n "$exe" && test -n "$msi"
              cp "$exe" "build/release-assets/desktop/saddle.browser.${version}.exe"
              cp "$msi" "build/release-assets/desktop/saddle.browser.${version}.msi"
              ;;
            macos)
              dmg="$(find desktop/src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
              test -n "$dmg"
              cp "$dmg" "build/release-assets/desktop/saddle.browser.${version}.dmg"
              ;;
          esac
          test -n "$(find build/release-assets/desktop -type f -print -quit)"
          checksums="sha256.desktop.${{ matrix.platform }}.${version}"
          manifest="manifest.desktop.${{ matrix.platform }}.${version}.json"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum build/release-assets/desktop/saddle.browser.* > "build/release-assets/desktop/${checksums}"; else shasum -a 256 build/release-assets/desktop/saddle.browser.* > "build/release-assets/desktop/${checksums}"; fi
          sed -i.bak 's#build/release-assets/desktop/##g' "build/release-assets/desktop/${checksums}" && rm -f "build/release-assets/desktop/${checksums}.bak"
          printf '{\n  "version": "%s",\n  "platform": "%s",\n  "signing": "caller-owned",\n  "files": [' "$version" "${{ matrix.platform }}" > "build/release-assets/desktop/${manifest}"
          find build/release-assets/desktop -type f ! -name "${checksums}" ! -name "${manifest}" -exec basename {} \; | awk 'BEGIN { first=1 } { if (!first) printf ","; printf "\"%s\"", $0; first=0 }' >> "build/release-assets/desktop/${manifest}"
          printf ']\n}\n' >> "build/release-assets/desktop/${manifest}"
          ! find build/release-assets/desktop -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .

      - name: upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saddle.browser.${{ matrix.platform }}.${{ steps.releaseversion.outputs.version }}
          path: build/release-assets/desktop
          if-no-files-found: error

      - name: attach release assets
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/release-assets/desktop/* --clobber
