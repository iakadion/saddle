name: publish maven

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.7.0"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          server-id: github
          settings-path: ${{ github.workspace }}
      - name: publish package
        run: mvn --batch-mode --settings settings.xml -Drevision="${RELEASE_VERSION#v}" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
