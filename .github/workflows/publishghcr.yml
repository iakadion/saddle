name: publish ghcr

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  image: ghcr.io/${{ github.repository_owner }}/saddle

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
      - name: resolve release version
        id: release
        uses: ./.github/actions/releaseversion
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: restore workflow source dockerfile
        shell: bash
        run: git checkout "${GITHUB_SHA}" -- dockerfile.saddle
      - name: login ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image tags
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          {
            echo "version=${version}"
            echo 'tags<<EOF'
            echo "${image}:${version}"
            echo "${image}:latest"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
      - name: build image for security scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile.saddle
          load: true
          tags: saddle:scan-${{ steps.release.outputs.version }}
      - name: scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: saddle:scan-${{ steps.release.outputs.version }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: build and push image with attestations
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfile.saddle
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          provenance: mode=max
          sbom: true
