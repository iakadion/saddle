name: mobile artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package
        required: true
        type: string
      build_ios:
        description: Build iOS only when Apple signing and provisioning secrets are configured
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  android:
    name: android release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: resolve release version
        id: releaseversion
        uses: ./.github/actions/releaseversion
        with:
          checkout_tag: "false"
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26.7.0
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: setup android
        uses: android-actions/setup-android@v3
      - name: install android sdk packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: install node dependencies
        run: npm ci
      - name: build shared web surface
        run: npm run web:build:pages
      - name: synchronize capacitor android surface
        run: npx cap sync android
      - name: flatten generated android staging
        run: npm run native:flatten:android
      - name: validate flat native surfaces
        run: npm run native:check:flat
      - name: derive android version values
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          IFS=. read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "SADDLE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SADDLE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - name: configure android signing
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEY_BASE64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/saddle-upload.jks"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/saddle-upload.jks"
              printf 'storePassword=%s\n' "$ANDROID_KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > android/keystore.properties
            echo "SADDLE_SIGNING=caller-key" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/saddle-test.jks" -storepass changeit -keypass changeit -alias saddle-test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Saddle CI Test,O=Saddle,C=US"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/saddle-test.jks"
              printf 'storePassword=changeit\n'
              printf 'keyAlias=saddle-test\n'
              printf 'keyPassword=changeit\n'
            } > android/keystore.properties
            echo "SADDLE_SIGNING=ci-test-key" >> "$GITHUB_ENV"
          fi
      - name: build optimized android release
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
      - name: collect android artifacts
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          mkdir -p build/release-assets/android
          apk="saddle.apk.${version}.apk"
          aab="saddle.aab.${version}.aab"
          checksums="sha256.android.${version}"
          manifest="manifest.android.${version}.json"
          apk_source="$(find android/build/outputs/apk/release -type f \( -name 'android-release*.apk' -o -name 'app-release*.apk' \) -print -quit)"
          aab_source="$(find android/build/outputs/bundle/release -type f \( -name 'android-release*.aab' -o -name 'app-release*.aab' \) -print -quit)"
          test -n "$apk_source" && test -n "$aab_source"
          cp "$apk_source" "build/release-assets/android/${apk}"
          cp "$aab_source" "build/release-assets/android/${aab}"
          sha256sum "build/release-assets/android/${apk}" "build/release-assets/android/${aab}" | sed 's#build/release-assets/android/##' > "build/release-assets/android/${checksums}"
          printf '{\n  "version": "%s",\n  "platform": "android",\n  "signing": "%s",\n  "optimization": "r8-and-resource-shrinking",\n  "files": ["%s", "%s"]\n}\n' "$version" "${SADDLE_SIGNING:-unknown}" "$apk" "$aab" > "build/release-assets/android/${manifest}"
      - name: validate public asset names
        shell: bash
        run: |
          ! find build/release-assets/android -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .
      - name: upload android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saddle.android.${{ steps.releaseversion.outputs.version }}
          path: build/release-assets/android
          if-no-files-found: error
      - name: attach android assets
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/release-assets/android/* --clobber

  ios:
    name: ios ipa
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_ios == true) || vars.SADDLE_IOS_ENABLED == 'true' }}
    runs-on: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: resolve release version
        id: releaseversion
        uses: ./.github/actions/releaseversion
        with:
          checkout_tag: "false"
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26.7.0
      - name: install node dependencies
        run: npm ci
      - name: build shared web surface
        run: npm run web:build:pages
      - name: synchronize capacitor ios surface
        run: npx cap sync ios
      - name: validate flat native surfaces
        run: npm run native:check:flat
      - name: configure ios export options
        env:
          IOS_EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}
        run: |
          if [ -z "${IOS_EXPORT_OPTIONS_BASE64:-}" ]; then
            echo "IOS_EXPORT_OPTIONS_BASE64 is required when iOS packaging is enabled."
            exit 1
          fi
          printf '%s' "$IOS_EXPORT_OPTIONS_BASE64" | base64 --decode > "$RUNNER_TEMP/SaddleExportOptions.plist"
      - name: derive ios version values
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          IFS=. read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "SADDLE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SADDLE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - name: archive ios app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -archivePath "$RUNNER_TEMP/Saddle.xcarchive" archive MARKETING_VERSION="$SADDLE_VERSION" CURRENT_PROJECT_VERSION="$SADDLE_VERSION_CODE"
      - name: export ipa
        run: xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Saddle.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/SaddleExportOptions.plist" -exportPath "$RUNNER_TEMP/SaddleExport"
      - name: collect ios artifacts
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          mkdir -p build/release-assets/ios
          ipa="saddle.ipa.${version}.ipa"
          checksums="sha256.ios.${version}"
          manifest="manifest.ios.${version}.json"
          source="$(find "$RUNNER_TEMP/SaddleExport" -type f -name '*.ipa' -print -quit)"
          test -n "$source"
          cp "$source" "build/release-assets/ios/${ipa}"
          shasum -a 256 "build/release-assets/ios/${ipa}" | sed 's#build/release-assets/ios/##' > "build/release-assets/ios/${checksums}"
          printf '{\n  "version": "%s",\n  "platform": "ios",\n  "signing": "caller-configured",\n  "files": ["%s"]\n}\n' "$version" "$ipa" > "build/release-assets/ios/${manifest}"
      - name: validate public asset names
        shell: bash
        run: |
          ! find build/release-assets/ios -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .
      - name: upload ios artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saddle.ios.${{ steps.releaseversion.outputs.version }}
          path: build/release-assets/ios
          if-no-files-found: error
      - name: attach ios assets
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/release-assets/ios/* --clobber
