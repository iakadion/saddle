name: container release artifact

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: resolve release version
        id: releaseversion
        uses: ./.github/actions/releaseversion
      - name: build container
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.releaseversion.outputs.version }}
        run: |
          docker build --build-arg SADDLE_VERSION="${{ steps.releaseversion.outputs.version }}" --tag "$IMAGE" .
          docker save "$IMAGE" | gzip -9 > "saddle-container-${{ steps.releaseversion.outputs.version }}.tar.gz"
      - name: checksum and manifest
        shell: bash
        run: |
          sha256sum "saddle-container-${{ steps.releaseversion.outputs.version }}.tar.gz" > SHA256SUMS-container
          printf '{\n  "version": "%s",\n  "image": "ghcr.io/%s:%s",\n  "archive": "saddle-container-%s.tar.gz",\n  "signing": "caller-owned"\n}\n' "${{ steps.releaseversion.outputs.version }}" "${{ github.repository }}" "${{ steps.releaseversion.outputs.version }}" "${{ steps.releaseversion.outputs.version }}" > container-artifact-manifest.json
      - name: upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: saddle-container-${{ steps.releaseversion.outputs.version }}
          path: |
            saddle-container-${{ steps.releaseversion.outputs.version }}.tar.gz
            SHA256SUMS-container
            container-artifact-manifest.json
          if-no-files-found: error
      - name: attach release assets
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "saddle-container-${{ steps.releaseversion.outputs.version }}.tar.gz" SHA256SUMS-container container-artifact-manifest.json --clobber
