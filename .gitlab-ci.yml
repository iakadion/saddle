stages:
  - verify
  - package
verify:
  stage: verify
  image: node:26.7.0
  script:
    - npm ci
    - npm run check
    - npm run formatcheck
    - npm test
    - npm run pack:check
  artifacts:
    when: always
    paths:
      - results/

package:
  stage: package
  image: node:26.7.0
  needs: [verify]
  script:
    - npm ci
    - npm pack --dry-run
  artifacts:
    when: always
    paths:
      - '*.tgz'
