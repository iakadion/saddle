name: saddle codeberg pages
on:
  push:
    branches: [main]
    paths: ["web/**", "package.json", "package-lock.json", ".forgejo/workflows/codeberg-pages.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: https://data.forgejo.org/actions/checkout@v6
      - name: setup node
        uses: https://data.forgejo.org/actions/setup-node@v6
        with:
          node-version: 26.7.0
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: check web
        run: npm run web:check
      - name: build web
        env:
          VITE_BASE_PATH: ${{ vars.SADDLE_PAGES_BASE_PATH || '/' }}
        run: npm run web:build:pages
      - name: prepare pages output
        run: cp web/dist/public/index.html web/dist/public/404.html && touch web/dist/public/.nojekyll
      - name: publish codeberg pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/${{ forge.repository_name }}/
          token: ${{ forge.token }}
          source: web/dist/public/
