name: saddle web pages
on:
  push:
    branches: [main]
    paths: ["web/**", "package.json", "package-lock.json", ".forgejo/workflows/pages.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: https://data.forgejo.org/actions/checkout@v6
      - name: setup node
        uses: https://data.forgejo.org/actions/setup-node@v6
        with:
          node-version: 26.7.0
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: check web
        run: npm run web:check
      - name: build web
        env:
          VITE_BASE_PATH: ${{ vars.SADDLE_PAGES_BASE_PATH || '/' }}
        run: npm run web:build:pages
      - name: upload artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: saddle-pages
          path: web/dist/public
