when:
  - event: push
    branch: main
    path:
      include: [web/**, package.json, package-lock.json, .woodpecker/pages.yml]
  - event: manual
steps:
  check:
    image: node:26.7.0
    commands:
      - npm ci
      - npm run web:check
      - VITE_BASE_PATH="${SADDLE_PAGES_BASE_PATH:-/}" npm run web:build:pages
      - cp web/dist/public/index.html web/dist/public/404.html
      - touch web/dist/public/.nojekyll
