name: build pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - name: enable pnpm
        run: corepack enable
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm run check
      - name: build static site
        env:
          VITE_BASE_PATH: /saddle-pages/
        run: pnpm run build:pages
      - name: prepare artifact
        run: cp dist/public/index.html dist/public/404.html && touch dist/public/.nojekyll
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: saddle-pages
          path: dist/public
