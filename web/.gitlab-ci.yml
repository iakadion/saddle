stages:
  - deploy

deploy-pages:
  stage: deploy
  image: node:26.7.0
  script:
    - corepack enable
    - corepack prepare pnpm@10.4.1 --activate
    - pnpm install --frozen-lockfile
    - pnpm run check
    - VITE_BASE_PATH=/saddle-pages/ pnpm run build:pages
    - rm -rf public
    - cp -R dist/public public
    - cp public/index.html public/404.html
    - touch public/.nojekyll
  pages: true
  artifacts:
    paths:
      - public
