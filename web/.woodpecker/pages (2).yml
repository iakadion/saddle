when:
  - event: push
    branch: main
  - event: manual

steps:
  build:
    image: node:26.7.0
    commands:
      - corepack enable
      - corepack prepare pnpm@10.4.1 --activate
      - pnpm install --frozen-lockfile
      - pnpm run check
      - VITE_BASE_PATH=/saddle-pages/ pnpm run build:pages
      - cp dist/public/index.html dist/public/404.html
      - touch dist/public/.nojekyll
