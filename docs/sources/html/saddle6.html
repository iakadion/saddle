datasource db {

model Site {
  id        String   @id @default(cuid())
  domain    String   @unique // seu-site.vercel.app
  plan      String   @default("hobby") // hobby = 512MB compute, ilimitado file via chunks

  storagePointer BigInt @default(0) // TB tracker: soma de todos File.size

model File {
  id        String   @id @default(cuid())
  siteId    String
  site      Site     @relation(fields: [siteId], references: [id])

  size      BigInt   // BigInt p/ TB: 600_000_000_000n = 600GB

  chunkCount Int

  chunks    FileChunk[]
  jobs      ComputeJob[]

  metadata  Json?    // { originalRepos: [1..10], cdnUrls: [...] }
  
  @@index([siteId])
  @@index([size]) // busca por TB range
}

model FileChunk {
  id        String   @id @default(cuid())
  fileId    String
  file      File     @relation(fields: [fileId], references: [id], onDelete: Cascade)

  index     Int      // 0..599 para 600MB file
  byteOffset BigInt  // BigInt pointer: index * 1_048_576n = offset p/ TB reconstruct
  size      Int      // 1_048_576

  data      Bytes?   @db.ByteA  // opcional, se guarda direto no Postgres

  nextChunkId String? // linked list pointer p/ reconstrução rápida
  checksum  String

  @@unique([fileId, index])
  @@index([repoId])
  @@index([byteOffset]) // BigInt index scan p/ range 0..TB
}

  id        String   @id @default(cuid())
  siteId    String
  site      Site     @relation(fields: [siteId], references: [id])
  fileId    String?
  file      File?    @relation(fields: [fileId], references: [id])

  @@index([siteId])
