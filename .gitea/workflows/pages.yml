name: saddle web pages
on:
  push:
    branches: [main]
    paths: ["web/**", "package.json", "package-lock.json", ".gitea/workflows/pages.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: check web
        run: npm run web:check
      - name: build web
        env:
          VITE_BASE_PATH: ${{ vars.SADDLE_PAGES_BASE_PATH || '/' }}
        run: npm run web:build:pages
      - name: prepare artifact
        run: cp web/dist/public/index.html web/dist/public/404.html && touch web/dist/public/.nojekyll
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: saddle-pages
          path: web/dist/public
