stages:
  - verify
  - package
  - pages
verify:
  stage: verify
  image: node:26.7.0
  script:
    - npm ci
    - npm run check
    - npm run formatcheck
    - npm test
    - npm run pack:check
  artifacts:
    when: always
    paths:
      - results/

package:
  stage: package
  image: node:26.7.0
  needs: [verify]
  script:
    - npm ci
    - npm pack --dry-run
  artifacts:
    when: always
    paths:
      - '*.tgz'

webpages:
  stage: pages
  image: node:26.7.0
  script:
    - npm ci
    - npm run web:check
    - VITE_BASE_PATH="${VITE_BASE_PATH:-/}" npm run web:build:pages
    - rm -rf public
    - cp -R web/dist/public public
    - cp public/index.html public/404.html
    - touch public/.nojekyll
  pages: true
  artifacts:
    paths:
      - public
